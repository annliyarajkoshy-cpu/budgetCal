<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Budget Tracker - Home</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body>



    <nav class="navbar">



        <div class="welcome">


            Welcome,  <span id="userName"> User </span>

        </div>



        <button onclick="logout()"class="logout-btn">Logout</button>


    </nav>




    <div class="container dashboard-container">



        <div class="dashboard-title">

            <h1>

                <span class="budget">
                    Budget
                </span>

                <span class="tracker">
                    Tracker
                </span>

            </h1>


            

        </div>




        <div class="row g-4">


       

            <div class="col-md-6">

                <div class="summary-card balance-card">


                    <div>

                        <p>
                            Total Balance
                        </p>


                        <h2 id="balance">
                            Rs 0/-
                        </h2>

                    </div>


                    


                </div>

            </div>





            <div class="col-md-6">

                <div class="summary-card expense-card">


                    <div>

                        <p>
                            Total Expense
                        </p>


                        <h2 id="totalExpense">
                            Rs 0/-
                        </h2>

                    </div>


                    


                </div>

            </div>


        </div>



     

        <div class="row g-4 mt-2">




            <div class="col-md-6">

                <div class="wallet-card">


                    <h3 class="income-heading"> Add Income</h3>


                   

                    <div class="input-group-custom">

                        <label>
                            Income Type
                        </label>


                        <input
                            type="text"
                            id="incomeType"
                            class="form-control"
                            placeholder="Enter type">

                    </div>


                    <div class="input-group-custom">

                        <label>
                            Amount
                        </label>


                        <input
                           
                            id="incomeAmount"
                            class="form-control"
                            placeholder="Enter amount"
                            min="1">

                    </div>


               

                    <button onclick="addIncome()"class="income-btn">Add Income</button>


                </div>

            </div>



          
            <div class="col-md-6">

                <div class="wallet-card">


                    <h3 class="expense-heading"> Add Expense</h3>



                    <div class="input-group-custom">

                        <label>
                            Expense Type
                        </label>


                        <input
                            type="text"
                            id="expenseType"
                            class="form-control"
                            placeholder="Enter type">

                    </div>


                    
                    <div class="input-group-custom">

                        <label>
                            Amount
                        </label>


                        <input
                            id="expenseAmount"
                            class="form-control"
                            placeholder="Enter amount"
                            min="1">

                    </div>


                  

                    <button onclick="addExpense()"class="expense-btn">Add Expense </button>


                </div>

            </div>


        </div>



      

        <div class="wallet-card transaction-card mt-4">


            <div class="transaction-header">


                <div>

                    <h3>


                        Transaction Log

                    </h3>


                    <p>
                        Your income and expenses
                    </p>

                </div>


             

                <button
                    onclick="clearAll()"
                    class="clear-btn">

                    <i class="fa-solid fa-trash"></i>

                    Clear All

                </button>


            </div>



       

            <div class="table-responsive">

                <table class="table">


                    <thead>

                        <tr>

                            <th>
                                Type
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Amount
                            </th>

                        </tr>

                    </thead>


                    <tbody id="transactionLog">

                    </tbody>


                </table>

            </div>


           
            <p
                id="emptyMessage"
                class="empty-message">

                No transactions yet.

            </p>


        </div>


    </div>



    <script src="script.js"></script>

</body>

</html>
