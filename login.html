<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Budget Tracker - Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <div class="auth-container">

        <div class="auth-card">


           

           

  

            <h1>
               Budget Tracker
            </h1>


           


            <h3>
                Login
            </h3>


            <form id="loginForm">


            

                <div class="input-group-custom">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


          

                <div class="input-group-custom">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                </div>


          
                <p
                    id="loginMessage"
                    class="message">
                </p>



                <button
                    type="submit"
                    class="main-btn">

                    Login

                </button>


            </form>


           
            <p class="switch-page">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>


        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
